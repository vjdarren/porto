<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, description, canonical, link-preview tags and JSON-LD for each
         page are written here at build time by scripts/prerender.mjs (from src/seo.js). -->
    <!--app-head-->
    <noscript><style>.rv { opacity: 1; transform: none; filter: none; }</style></noscript>

    <!-- Self-hosted fonts (@font-face in index.css); preload the two the hero sets first. -->
    <link rel="preload" href="/fonts/clash-display-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Reveal what the first screen shows before the app loads, so the largest
         text paints without waiting on JavaScript; @starting-style in index.css
         keeps the fade. */
      for (const el of document.querySelectorAll('.rv')) if (el.getBoundingClientRect().top < innerHeight) el.classList.add('in')
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
